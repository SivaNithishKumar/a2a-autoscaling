apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-multi-agent-a2a
  namespace: multi-agent-a2a
  labels:
    grafana_dashboard: "1"
data:
  multi-agent-a2a-dashboard.json: |
    {
      "id": null,
      "title": "Multi-Agent A2A System - Production Dashboard",
      "tags": ["a2a", "agents", "multi-agent", "orchestration"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "links": [],
      "panels": [
          {
            "id": 1,
            "title": "A2A Agent CPU Usage (%)",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"multi-agent-a2a\",pod=~\".*agent.*\"}[5m]) * 100",
                "legendFormat": "{{pod}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "custom": {"displayMode": "list", "orientation": "auto"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 50},
                    {"color": "red", "value": 80}
                  ]
                },
                "unit": "percent",
                "min": 0,
                "max": 100
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "A2A Agent Memory Usage",
            "type": "stat", 
            "targets": [
              {
                "expr": "container_memory_usage_bytes{namespace=\"multi-agent-a2a\",pod=~\".*agent.*\"}",
                "legendFormat": "{{pod}}",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "custom": {"displayMode": "list", "orientation": "auto"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 1073741824},
                    {"color": "red", "value": 2147483648}
                  ]
                },
                "unit": "bytes",
                "min": 0
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Pod Status",
            "type": "stat",
            "targets": [
              {
                "expr": "kube_pod_status_phase{namespace=\"multi-agent-a2a\",pod=~\".*agent.*\",phase=\"Running\"}",
                "legendFormat": "{{pod}} - {{phase}}",
                "refId": "C"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "custom": {"displayMode": "list", "orientation": "auto"},
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                },
                "mappings": [
                  {"options": {"0": {"text": "NOT RUNNING"}}, "type": "value"},
                  {"options": {"1": {"text": "RUNNING"}}, "type": "value"}
                ]
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "HPA Scaling Status",
            "type": "stat",
            "targets": [
              {
                "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"multi-agent-a2a\"}",
                "legendFormat": "{{horizontalpodautoscaler}} - Current",
                "refId": "D"
              },
              {
                "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"multi-agent-a2a\"}",
                "legendFormat": "{{horizontalpodautoscaler}} - Desired",
                "refId": "E"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"displayMode": "list", "orientation": "auto"},
                "unit": "short"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Agent CPU Usage Over Time",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"multi-agent-a2a\",pod=~\".*agent.*\"}[5m]) * 100",
                "legendFormat": "{{pod}}",
                "refId": "F"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5},
                "unit": "percent",
                "min": 0
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Agent Memory Usage Over Time",
            "type": "timeseries",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{namespace=\"multi-agent-a2a\",pod=~\".*agent.*\"}",
                "legendFormat": "{{pod}}",
                "refId": "G"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 1, "fillOpacity": 10, "pointSize": 5},
                "unit": "bytes",
                "min": 0
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "timepicker": {},
        "templating": {"list": []},
        "annotations": {"list": []},
        "refresh": "30s",
        "schemaVersion": 27,
        "version": 1,
        "links": []
      }
